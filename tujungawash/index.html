<script>
/* Force .Site.loaded class so Squarespace's fade-in CSS unmasks. */
(function(){
  function markLoaded(){
    document.documentElement.classList.add('loaded');
    if (document.body) document.body.classList.add('loaded');
    // The Site element wraps everything; SiteLoader normally adds .loaded to it.
    var site = document.querySelector('.Site');
    if (site) site.classList.add('loaded');
    // Also flag individual image holders that gate on .loaded class
    document.querySelectorAll('.Intro-image, .Index-page-image, .Index-gallery, .sqs-system-gallery').forEach(function(el){
      el.classList.add('loaded', 'sqs-system-gallery-ready');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', markLoaded);
  } else {
    markLoaded();
  }
})();
</script>
