<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donations no longer accepted — The River Project</title>
<style>
body{font-family:'Mulish',sans-serif;background:#fff;color:#222;margin:0;padding:4rem 2rem;line-height:1.6;text-align:center}
.box{max-width:640px;margin:0 auto}
h1{font-size:2rem;margin-bottom:1rem}
p{margin:1rem 0}
a{color:#3a6ea5;text-decoration:underline}
</style>
<!-- gallery-img-constrain v2 -->
<style>
/* Squarespace JS-driven galleries don't work statically. Convert all gallery
   layouts into a flat CSS grid so every image is visible at a sensible size.
   This applies to thumb-image grids and stacked-slideshow galleries. */
.sqs-gallery,
.sqs-gallery-design-stacked,
.sqs-gallery-design-grid,
.sqs-gallery-design-strip,
.sqs-gallery-block-grid,
.sqs-block-gallery .sqs-gallery {
  display: grid !important;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
  gap: 12px !important;
  height: auto !important;
  position: static !important;
  width: 100% !important;
}
.sqs-gallery .slide,
.sqs-gallery-design-stacked-slide,
.sqs-gallery-design-stacked .slide,
.sqs-gallery-design-grid .slide,
.sqs-gallery-block-grid .slide {
  position: relative !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  z-index: auto !important;
  display: block !important;
  width: auto !important;
  height: auto !important;
  transform: none !important;
}
.sqs-gallery img.thumb-image,
.sqs-gallery .slide img,
.sqs-gallery-design-stacked img,
.sqs-gallery-design-grid img {
  width: 100% !important;
  height: 220px !important;
  object-fit: cover !important;
  display: block !important;
  max-width: 100% !important;
}
/* Hide arrow/dot controls of slideshow (no longer functional) */
.sqs-gallery-controls,
.sqs-gallery-design-stacked-controls { display: none !important; }
/* Generic image fallback */
img.thumb-image,
.image-block img,
.sqs-block-image img {
  max-width: 100% !important;
  height: auto;
}
</style>
<!-- gallery-img-constrain v2 -->
</head>
<body>
<div class="box">
<h1>Donations no longer accepted</h1>
<p>The River Project 501(c)(3) was dissolved in 2026.</p>
<p>This website is preserved as an archive of Melanie Winter's work and the
organization's contributions to the Los Angeles River watershed.</p>
<p><a href="index.html">Return to the homepage</a></p>
</div>
</body>
</html>
