<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donations no longer accepted — The River Project</title>
<style>
body{font-family:'Mulish',sans-serif;background:#fff;color:#222;margin:0;padding:4rem 2rem;line-height:1.6;text-align:center}
.box{max-width:640px;margin:0 auto}
h1{font-size:2rem;margin-bottom:1rem}
p{margin:1rem 0}
a{color:#3a6ea5;text-decoration:underline}
</style>
<!-- galleries-moved-to-bottom v1 -->
<!-- gallery-img-constrain v4 -->
<style>
/* Static archive: render Squarespace galleries as full-width vertical
   sequence. v4: override JS-applied inline position:absolute on imgs. */
.sqs-gallery,
.sqs-gallery-design-stacked,
.sqs-gallery-design-grid,
.sqs-gallery-design-strip,
.sqs-gallery-block-grid,
.sqs-block-gallery .sqs-gallery {
  display: block !important; width: 100% !important; height: auto !important;
  position: static !important; margin: 0 0 1rem 0 !important;
}
.sqs-gallery .slide,
.sqs-gallery-design-stacked-slide,
.sqs-gallery-design-stacked .slide,
.sqs-gallery-design-grid .slide,
.sqs-gallery-block-grid .slide {
  display: block !important; position: relative !important;
  opacity: 1 !important; visibility: visible !important;
  pointer-events: auto !important; z-index: auto !important;
  width: 100% !important; height: auto !important;
  margin: 0 0 1rem 0 !important; transform: none !important;
  float: none !important; clear: both !important;
  transition: none !important;
}
/* CRITICAL v4 fix: Squarespace JS sets inline position:absolute on the
   gallery imgs themselves. Override that so they participate in flow. */
.sqs-gallery img.thumb-image,
.sqs-gallery .slide img,
.sqs-gallery-design-stacked img,
.sqs-gallery-design-grid img,
.sqs-gallery-block-grid img {
  display: block !important;
  position: static !important;
  top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
  width: 100% !important; height: auto !important;
  max-width: 100% !important;
  object-fit: contain !important;
  margin: 0 0 0.5rem 0 !important;
  transition: none !important;
}
/* Force the active-slide class to not affect display */
.sqs-active-slide, .sqs-gallery-design-stacked .sqs-active-slide {
  opacity: 1 !important; visibility: visible !important; z-index: auto !important;
}
.sqs-gallery-controls,
.sqs-gallery-design-stacked-controls,
.sqs-gallery-design-stacked-bullet,
.sqs-gallery-design-stacked-thumbnail-strip { display: none !important; }
img.thumb-image, .image-block img, .sqs-block-image img {
  max-width: 100% !important; height: auto;
}
</style>
<!-- gallery-img-constrain v4 -->
<!-- archive-section-fullwidth v1 -->
<style>
/* Force everything inside the moved gallery section to full width.
   Galleries originally lived in 2-column rows; Squarespace JS sized
   children based on those narrow columns. */
section.archive-gallery-section {
  width: 100% !important;
  max-width: 100% !important;
  display: block !important;
  clear: both !important;
}
section.archive-gallery-section,
section.archive-gallery-section .sqs-row,
section.archive-gallery-section .sqs-row > .col,
section.archive-gallery-section .row,
section.archive-gallery-section .col,
section.archive-gallery-section .sqs-block,
section.archive-gallery-section .sqs-block-content,
section.archive-gallery-section .sqs-gallery,
section.archive-gallery-section .sqs-gallery-design-stacked,
section.archive-gallery-section .sqs-gallery-design-stacked-slide,
section.archive-gallery-section .slide,
section.archive-gallery-section .image-slide-anchor {
  width: 100% !important;
  max-width: 100% !important;
  float: none !important;
  position: relative !important;
  display: block !important;
}
section.archive-gallery-section img {
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  position: static !important;
  top: auto !important; left: auto !important;
  display: block !important;
  margin: 0 0 0.5rem 0 !important;
}
</style>
<!-- archive-section-fullwidth v1 -->
</head>
<body>
<div class="box">
<h1>Donations no longer accepted</h1>
<p>The River Project 501(c)(3) was dissolved in 2026.</p>
<p>This website is preserved as an archive of Melanie Winter's work and the
organization's contributions to the Los Angeles River watershed.</p>
<p><a href="index.html">Return to the homepage</a></p>
</div>
</body>
</html>
